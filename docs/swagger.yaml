basePath: /
definitions:
  model.Menu:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      link:
        type: string
      menu_name:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API หลังบ้านเว็บไซต์โรงพยาบาลสะเมิง (ข่าว กิจกรรม บุคลากร ITA/MOIT
    ผู้ใช้งาน สิทธิ์เมนู)
  title: Hospital Samoeng API
  version: "1.0"
paths:
  /activities:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: list กิจกรรมทั้งหมด
      tags:
      - activities
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: ชื่อกิจกรรม
        in: formData
        name: title
        required: true
        type: string
      - description: รายละเอียด
        in: formData
        name: description
        type: string
      - description: วันเริ่ม
        in: formData
        name: startDate
        type: string
      - description: วันจบ
        in: formData
        name: endDate
        type: string
      - description: รูปภาพ .jpg/.jpeg/.png
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: นามสกุลไฟล์ไม่ถูกต้อง
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: สร้างกิจกรรมใหม่ (แนบรูปได้)
      tags:
      - activities
  /activities/{id}:
    get:
      parameters:
      - description: activity id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: ดูกิจกรรมรายตัว
      tags:
      - activities
  /hero:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: list รูปสไลด์ hero หน้าแรก (เรียงตามลำดับ)
      tags:
      - hero
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: รูปภาพ .jpg/.jpeg/.png
        in: formData
        name: image
        required: true
        type: file
      - description: ลำดับการแสดง (ยิ่งน้อยยิ่งขึ้นก่อน)
        in: formData
        name: order
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: เพิ่มรูปสไลด์ hero (admin)
      tags:
      - hero
  /hero/{id}:
    delete:
      parameters:
      - description: hero slide id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: เหลือรูปเดียว ลบไม่ได้
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: ลบรูปสไลด์ hero (admin) — ห้ามลบจนเหลือ 0 รูป
      tags:
      - hero
    put:
      consumes:
      - application/json
      parameters:
      - description: hero slide id
        in: path
        name: id
        required: true
        type: integer
      - description: ลำดับใหม่ เช่น {\
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: แก้ลำดับรูปสไลด์ hero (admin)
      tags:
      - hero
  /ita:
    get:
      parameters:
      - description: filter ตาม year id
        in: query
        name: year_id
        type: integer
      - description: หน้า (default 1)
        in: query
        name: page
        type: integer
      - description: ต่อหน้า (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data + meta{total,page,limit}
          schema:
            additionalProperties: true
            type: object
      summary: list ไฟล์ ITA (filter ตามปี + pagination)
      tags:
      - ita
  /ita/{id}:
    delete:
      parameters:
      - description: ITA file id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: ไม่พบไฟล์
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: ลบไฟล์ ITA (เฉพาะ admin)
      tags:
      - ita
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: ITA id
        in: path
        name: id
        required: true
        type: integer
      - description: ชื่อเอกสารใหม่
        in: formData
        name: title
        type: string
      - description: ไฟล์ PDF ใหม่ (ไม่แนบ = ใช้ไฟล์เดิม)
        in: formData
        name: file
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: แก้ไขเอกสาร ITA — เปลี่ยนชื่อ และ/หรือ เปลี่ยนไฟล์ PDF (เฉพาะ admin)
      tags:
      - ita
  /ita/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: MOIT item id
        in: formData
        name: item_id
        required: true
        type: integer
      - description: ITA year id (ต้องตรงกับ item)
        in: formData
        name: year_id
        required: true
        type: integer
      - description: ชื่อเอกสาร (ไม่ใส่ = ใช้ชื่อไฟล์)
        in: formData
        name: title
        type: string
      - description: ไฟล์ PDF
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: อัปโหลดไฟล์ PDF เข้า MOIT item (เฉพาะ admin)
      tags:
      - ita
  /ita/years:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: list ปี ITA ทั้งหมด (เรียงใหม่→เก่า)
      tags:
      - ita
    post:
      consumes:
      - application/json
      parameters:
      - description: ปี พ.ศ. 2500-2600
        in: body
        name: body
        required: true
        schema:
          properties:
            year:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ปีไม่ถูกต้อง/ซ้ำ
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: สร้างปี ITA ใหม่ (เฉพาะ admin)
      tags:
      - ita
  /ita/years/{id}/moit:
    get:
      parameters:
      - description: year id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: list MOIT ของปีที่เลือก
      tags:
      - moit
    post:
      consumes:
      - application/json
      parameters:
      - description: year id
        in: path
        name: id
        required: true
        type: integer
      - description: ชื่อ MOIT
        in: body
        name: body
        required: true
        schema:
          properties:
            description:
              type: string
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: สร้าง MOIT ในปีที่เลือก (เฉพาะ admin)
      tags:
      - moit
  /items/{id}:
    delete:
      parameters:
      - description: item id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: ลบ item (เฉพาะ admin)
      tags:
      - moit
    put:
      consumes:
      - application/json
      parameters:
      - description: item id
        in: path
        name: id
        required: true
        type: integer
      - description: ชื่อใหม่
        in: body
        name: body
        required: true
        schema:
          properties:
            label:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: แก้ไข item (เฉพาะ admin)
      tags:
      - moit
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: ข้อมูลล็อกอิน
        in: body
        name: body
        required: true
        schema:
          properties:
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: token + ข้อมูล user
          schema:
            additionalProperties: true
            type: object
        "401":
          description: user ไม่พบหรือรหัสผิด
          schema:
            additionalProperties: true
            type: object
        "403":
          description: บัญชีถูกปิดใช้งาน
          schema:
            additionalProperties: true
            type: object
      summary: ล็อกอิน รับ JWT token
      tags:
      - auth
  /menu:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: list เมนูทั้งหมด
      tags:
      - menu
    post:
      consumes:
      - application/json
      parameters:
      - description: ข้อมูลเมนู
        in: body
        name: menu
        required: true
        schema:
          $ref: '#/definitions/model.Menu'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: สร้างเมนูใหม่
      tags:
      - menu
  /menu/{id}:
    delete:
      parameters:
      - description: menu id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: ลบเมนู (เฉพาะ admin/employee)
      tags:
      - menu
    get:
      parameters:
      - description: menu id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: ดูเมนูรายตัว
      tags:
      - menu
    put:
      consumes:
      - application/json
      parameters:
      - description: menu id
        in: path
        name: id
        required: true
        type: integer
      - description: ข้อมูลเมนู
        in: body
        name: menu
        required: true
        schema:
          $ref: '#/definitions/model.Menu'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: แก้ไขเมนู
      tags:
      - menu
  /moit:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: list MOIT category ทั้งหมด
      tags:
      - ita
  /moit/{id}:
    delete:
      parameters:
      - description: moit id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: ลบ MOIT (เฉพาะ admin, ลูก topic/item/ไฟล์หายตาม CASCADE)
      tags:
      - moit
    put:
      consumes:
      - application/json
      parameters:
      - description: moit id
        in: path
        name: id
        required: true
        type: integer
      - description: ฟิลด์ที่จะแก้
        in: body
        name: body
        required: true
        schema:
          properties:
            description:
              type: string
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: แก้ไข MOIT (เฉพาะ admin)
      tags:
      - moit
  /moit/{id}/topics:
    get:
      parameters:
      - description: moit id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: list topic (พร้อม items) ของ MOIT
      tags:
      - moit
    post:
      consumes:
      - application/json
      parameters:
      - description: moit id
        in: path
        name: id
        required: true
        type: integer
      - description: ชื่อ topic
        in: body
        name: body
        required: true
        schema:
          properties:
            label:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: สร้าง topic ใน MOIT (เฉพาะ admin)
      tags:
      - moit
  /news:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: list ข่าวทั้งหมด
      tags:
      - news
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: หัวข้อข่าว
        in: formData
        name: title
        required: true
        type: string
      - description: รายละเอียด
        in: formData
        name: description
        type: string
      - description: วันที่
        in: formData
        name: date
        type: string
      - description: ประเภทข่าว
        in: formData
        name: type
        type: string
      - description: ไฟล์ PDF
        in: formData
        name: file
        type: file
      - description: รูปภาพ .jpg/.jpeg/.png
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: นามสกุลไฟล์ไม่ถูกต้อง
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: สร้างข่าวใหม่ (แนบไฟล์ PDF + รูปได้)
      tags:
      - news
  /news/{id}:
    delete:
      parameters:
      - description: news id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: ลบข่าว (เฉพาะ admin/employee)
      tags:
      - news
    get:
      parameters:
      - description: news id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: ดูข่าวรายตัว
      tags:
      - news
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: news id
        in: path
        name: id
        required: true
        type: integer
      - description: หัวข้อข่าว
        in: formData
        name: title
        required: true
        type: string
      - description: รายละเอียด
        in: formData
        name: description
        type: string
      - description: วันที่
        in: formData
        name: date
        type: string
      - description: ประเภทข่าว
        in: formData
        name: type
        type: string
      - description: ไฟล์ PDF ใหม่
        in: formData
        name: file
        type: file
      - description: รูปภาพใหม่ .jpg/.jpeg/.png
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: แก้ไขข่าว (เปลี่ยนไฟล์/รูปได้, ไม่แนบ = ใช้ของเดิม)
      tags:
      - news
  /personnel:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: list บุคลากรทั้งหมด
      tags:
      - personnel
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: คำนำหน้า
