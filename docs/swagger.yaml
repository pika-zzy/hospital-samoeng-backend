        name: prefix
        required: true
        type: string
      - description: ชื่อ
        in: formData
        name: name
        required: true
        type: string
      - description: นามสกุล
        in: formData
        name: lastname
        required: true
        type: string
      - description: ฝ่ายงาน/แผนก
        in: formData
        name: role
        required: true
        type: string
      - description: ตำแหน่ง
        in: formData
        name: position
        type: string
      - description: รูปภาพ .jpg/.jpeg/.png
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: เพิ่มบุคลากรใหม่ (แนบรูปได้)
      tags:
      - personnel
  /personnel/{id}:
    delete:
      parameters:
      - description: personnel id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: ลบบุคลากร (เฉพาะ admin/employee)
      tags:
      - personnel
    get:
      parameters:
      - description: personnel id
        in: path
        name: id
        required: true
        type: integer
      produces:
